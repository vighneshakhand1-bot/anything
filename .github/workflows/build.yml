name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/Fluensia/Fluensia.csproj
      - name: Build
        run: dotnet build src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained false
      - name: Publish (framework-dependent)
        run: dotnet publish src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained false -o dist/Fluensia
      - name: Publish (portable single file)
        run: >
          dotnet publish src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist/Fluensia-portable
      - name: Package
        run: |
          Compress-Archive -Path dist/Fluensia/* -DestinationPath Fluensia-win-x64.zip -Force
          Compress-Archive -Path dist/Fluensia-portable/* -DestinationPath Fluensia-win-x64-portable.zip -Force
          Compress-Archive -Path src/Fluensia/* -DestinationPath Fluensia-src.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Fluensia-windows
          path: |
            Fluensia-win-x64.zip
            Fluensia-win-x64-portable.zip
            Fluensia-src.zip

  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build (compile check)
        run: dotnet build src/Fluensia/Fluensia.csproj -c Release -r linux-x64

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fluensia-windows
      - name: Tag name
        id: tag
        run: echo "name=${GITHUB_REF_NAME:-build-${GITHUB_RUN_NUMBER}}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Fluensia ${{ steps.tag.outputs.name }}
          files: |
            Fluensia-win-x64.zip
            Fluensia-win-x64-portable.zip
            Fluensia-src.zip
          generate_release_notes: true
