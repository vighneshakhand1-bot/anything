name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/Fluensia/Fluensia.csproj
      - name: Build
        run: dotnet build src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained false
      - name: Publish (framework-dependent)
        run: dotnet publish src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained false -o dist/Fluensia
      - name: Layout preview (GPU-less) for every screen
        shell: pwsh
        run: |
          foreach ($s in @('games','workshop','account','settings','login')) {
            & dist/Fluensia/Fluensia.exe --ui-preview dist/preview --state $s
            if (-not (Test-Path "dist/preview/preview_$s.png")) { throw "preview failed for $s" }
          }
          if (-not (Select-String -Path dist/preview/preview_games.txt -Pattern 'Counter-Strike 2' -Quiet)) {
            throw "games screen did not draw its card titles"
          }
      - name: Publish (portable single file)
        run: >
          dotnet publish src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist/Fluensia-portable
      - name: Package
        run: |
          Compress-Archive -Path dist/Fluensia/* -DestinationPath Fluensia-win-x64.zip -Force
          Compress-Archive -Path dist/Fluensia-portable/* -DestinationPath Fluensia-win-x64-portable.zip -Force
          Compress-Archive -Path src/Fluensia/* -DestinationPath Fluensia-src.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Fluensia-windows
          path: |
            Fluensia-win-x64.zip
            Fluensia-win-x64-portable.zip
            Fluensia-src.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluensia-layout-preview
          path: dist/preview/*
          if-no-files-found: warn

  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build (compile check)
        run: dotnet build src/Fluensia/Fluensia.csproj -c Release -r linux-x64
      - name: Layout preview + geometry assertions (no GPU in CI)
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          BIN=$(find src/Fluensia/bin/Release -maxdepth 3 -name Fluensia -type f | head -1)
          echo "binary: $BIN"
          "$BIN" --ui-preview out --state games
          test -f out/preview_games.png && echo "preview ok"
          grep -q 'Counter-Strike 2' out/preview_games.txt || { echo "missing card title"; exit 1; }
          grep -q 'Запустить' out/preview_games.txt || { echo "missing CTA"; exit 1; }
          python3 tools/check_layout.py out/preview_games.layout.txt

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fluensia-windows
      - name: Tag name
        id: tag
        run: echo "name=${GITHUB_REF_NAME:-build-${GITHUB_RUN_NUMBER}}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Fluensia ${{ steps.tag.outputs.name }}
          files: |
            Fluensia-win-x64.zip
            Fluensia-win-x64-portable.zip
            Fluensia-src.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fluensia-layout-preview
          path: dist/preview/*
          generate_release_notes: true
