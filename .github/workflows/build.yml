name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write          # needed to POST a commit comment with the compiler output
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/Fluensia/Fluensia.csproj
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained false 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # Re-emit compiler diagnostics as workflow commands: those become job annotations, which
            # stay readable through the API even when the raw log blob is unavailable.
            python3 tools/annotate_errors.py build.log
            exit "$status"
          fi
      - name: Publish (framework-dependent)
        run: dotnet publish src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained false -o dist/Fluensia
      - name: Layout preview (GPU-less) for every screen
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($s in @('games','workshop','account','settings','login')) {
            foreach ($attempt in 1..2) {
              Write-Host "--- $s (attempt $attempt)"
              & dist/Fluensia/Fluensia.exe --ui-preview dist/preview --state $s
              Write-Host "exit=$LASTEXITCODE"
              if (Test-Path "dist/preview/preview_$s.png") { break }
            }
          }
          Get-ChildItem dist/preview -ErrorAction SilentlyContinue | Select-Object Name,Length
          if (-not (Select-String -Path dist/preview/preview_games.txt -Pattern 'Counter-Strike 2' -Quiet)) {
            throw "games screen did not draw its card titles"
          }
          python3 tools/check_layout.py dist/preview/preview_games.layout.txt
      - name: Publish (portable single file)
        run: >
          dotnet publish src/Fluensia/Fluensia.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist/Fluensia-portable
      - name: Package
        run: |
          Compress-Archive -Path dist/Fluensia/* -DestinationPath Fluensia-win-x64.zip -Force
          Compress-Archive -Path dist/Fluensia-portable/* -DestinationPath Fluensia-win-x64-portable.zip -Force
          # source zip: exclude build intermediates (bin/obj) so it stays small.
          # `git archive` keeps it to tracked files only and never fails on robocopy exit codes.
          git archive --format=zip --prefix=Fluensia-src/ -o Fluensia-src.zip HEAD src/Fluensia README.md .github .gitignore tools
      - uses: actions/upload-artifact@v4
        with:
          name: Fluensia-windows
          path: |
            Fluensia-win-x64.zip
            Fluensia-win-x64-portable.zip
            Fluensia-src.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluensia-layout-preview
          path: dist/preview/*
          if-no-files-found: warn

  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build (compile check)
        run: dotnet build src/Fluensia/Fluensia.csproj -c Release -r linux-x64
      - name: Layout preview + geometry assertions (no GPU in CI)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          DOTNET_DbgEnableMiniDump: 0
        run: |
          BIN=$(find src/Fluensia/bin/Release -maxdepth 3 -name Fluensia -type f | head -1)
          echo "binary: $BIN"
          set +e
          for s in games workshop account settings login; do
            "$BIN" --ui-preview out --state "$s" 2>&1 | tee -a preview.log
            echo "  [$s] exit=$?"
            if [ -f "out/preview_$s.png" ]; then
              grep -q . "out/preview_$s.txt" && echo "  [$s] drew $(wc -l < "out/preview_$s.txt") strings"
            fi
          done
          ls -la out
          python3 tools/annotate_log.py preview.log
          test -f out/preview_games.png || { echo "::warning::no games preview written"; exit 1; }
          python3 tools/check_layout.py out/preview_games.layout.txt
          echo "::warning::preview checks complete"

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fluensia-windows
          path: out
      - name: Tag name
        id: tag
        run: echo "name=${GITHUB_REF_NAME:-build-${GITHUB_RUN_NUMBER}}" >> "$GITHUB_OUTPUT"
      - name: Release with the built exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Fluensia ${{ steps.tag.outputs.name }}
          body: |
            Ready-to-run Windows build of the Fluensia launcher rebuild (C# + ImGui.NET).

            * `Fluensia-win-x64-portable.zip` - single self-contained exe, no .NET install needed
            * `Fluensia-win-x64.zip` - smaller, needs the .NET 8 Desktop Runtime
            * `Fluensia-src.zip` - full source, build with `src\Fluensia\build.bat`

            Controls: `1`-`4` switch screens, `M` flips the theme, `Esc` goes back, mouse for everything else.
          files: |
            out/Fluensia-win-x64.zip
            out/Fluensia-win-x64-portable.zip
            out/Fluensia-src.zip
          fail_on_unmatched_files: true
